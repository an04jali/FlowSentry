[build-system]
requires = ["setuptools>=68,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tool-drift"
version = "0.1.0"
description = "Detect drift between agent tool contracts, source code, and runtime dependency updates."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Agent Tool Drift contributors" }]
keywords = ["agent", "tools", "schema", "mcp", "openapi", "compatibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]
publish = ["build>=1.0", "twine>=6.2"]

[project.urls]
Homepage = "https://github.com/fykong/agent-tool-drift"
Issues = "https://github.com/fykong/agent-tool-drift/issues"

[project.scripts]
agent-tool-drift = "agent_tool_drift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
